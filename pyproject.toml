[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-agent-harness"
version = "0.2.0"
description = "A lightweight, inspectable terminal coding agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
terminal = ["prompt-toolkit>=3.0.43,<4"]

[project.scripts]
miniagent = "miniagent.cli:main"

[tool.setuptools]
packages = ["miniagent"]

[tool.setuptools.package-data]
miniagent = ["instructions.md"]
